<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Categoria — Visão do Espaço</title>
<link rel="stylesheet" href="css/style.css?v=2" />
<link rel="stylesheet" href="css/components.css?v=2" />
<link rel="stylesheet" href="css/animations.css?v=2" />
</head>
<body data-page="categoria">
<canvas id="starfield"></canvas>
<header class="site-header" id="site-header"></header>

<main data-cat-root>
  <section class="cat-hero">
    <div class="glow"></div>
    <div class="wrap">
      <span class="big-icon" data-cat-icon></span>
      <div class="eyebrow">Categoria</div>
      <h1 data-cat-title>Carregando…</h1>
      <p style="max-width:56ch" data-cat-desc></p>
      <span class="count" data-cat-count></span>
    </div>
  </section>

  <section data-cat-slider-section style="padding-top:32px;padding-bottom:0">
    <div class="wrap">
      <div class="hslider-wrap">
        <div class="hslider" data-hslider-track></div>
        <div class="hslider-arrows">
          <button data-hs-prev aria-label="Anterior">←</button>
          <button data-hs-next aria-label="Próximo">→</button>
        </div>
      </div>
    </div>
  </section>

  <section style="padding-top:48px">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <div class="eyebrow">Catálogo</div>
          <h2>Todos os objetos</h2>
        </div>
      </div>
      <div class="card-grid" data-cat-grid></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/loader.js?v=2"></script>
<script src="js/router.js?v=2"></script>
<script src="js/slider.js?v=2"></script>
<script src="js/search.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/main.js?v=2"></script>
</body>
</html>
