<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Planeta — Visão do Espaço</title>
<link rel="stylesheet" href="css/style.css?v=2" />
<link rel="stylesheet" href="css/components.css?v=2" />
<link rel="stylesheet" href="css/animations.css?v=2" />
</head>
<body data-page="planeta">
<canvas id="starfield"></canvas>
<header class="site-header" id="site-header"></header>

<main data-detail-root>
  <section class="detail-hero">
    <div class="glow"></div>
    <div class="wrap detail-hero-grid">
      <div>
        <div class="crumbs"><a href="index.html">Início</a> / <a href="index.html#sistema-solar">Sistema Solar</a> / <span data-title></span></div>
        <span class="symbol mono" data-symbol style="font-size:2.2rem;color:var(--purple-neon);display:block;margin-bottom:10px"></span>
        <div class="eyebrow" data-eyebrow></div>
        <h1 data-title></h1>
        <p class="lead" data-lead style="max-width:52ch;font-size:1.05rem"></p>
        <a class="btn primary" href="#dados">Explorar dados →</a>
      </div>
      <div class="orb"></div>
    </div>
  </section>

  <section id="dados">
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <div class="eyebrow">Dados físicos</div>
          <h2>Números que definem este mundo</h2>
        </div>
      </div>
      <div class="fact-grid reveal" data-fact-grid></div>
    </div>
  </section>

  <section data-luas-section>
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <div class="eyebrow">Satélites naturais</div>
          <h2>Luas</h2>
        </div>
      </div>
      <div class="hslider-wrap">
        <div class="hslider" data-hslider-track></div>
        <div class="hslider-arrows">
          <button data-hs-prev aria-label="Anterior">←</button>
          <button data-hs-next aria-label="Próximo">→</button>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <div class="eyebrow">Galeria</div>
          <h2>Imagens e visualizações</h2>
        </div>
      </div>
      <div class="hslider-wrap">
        <div class="hslider gallery-strip" data-gallery-track></div>
      </div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <div class="section-head reveal">
        <div>
          <div class="eyebrow">Enciclopédia</div>
          <h2>Conheça em profundidade</h2>
        </div>
      </div>
      <div class="rich-sections" data-rich-sections></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="js/loader.js?v=2"></script>
<script src="js/router.js?v=2"></script>
<script src="js/slider.js?v=2"></script>
<script src="js/search.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/main.js?v=2"></script>
</body>
</html>
